# Service Port
# This will be the main entry point for your frontend
server.port=8080

# Application Name
spring.application.name=gateway-service

# Eureka Client Configuration (to register with and discover services from Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Or use hostname
eureka.instance.prefer-ip-address=true 

# Spring Cloud Gateway Routes (Example - We will add more specific routes later)
# This tells the gateway to use service discovery (lb stands for load-balanced)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true # Converts service IDs to lowercase for routes

# Example route (if you want to explicitly define a route)
# spring.cloud.gateway.routes[0].id=user-service-route
# spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE # USER-SERVICE is the name the service registers with Eureka
# spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
